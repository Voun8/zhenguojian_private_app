name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none lib test integration_test test_driver
      - run: dart analyze lib test integration_test test_driver
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
        continue-on-error: true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
        continue-on-error: true
      - run: go test -race ./...
        working-directory: native
        continue-on-error: true
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native
        continue-on-error: true

  android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
      - name: Configure Android signing
        run: python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py ${{ matrix.arguments }}
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
  windows:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: |
          choco install mingw --no-progress -y
          'C:\ProgramData\mingw64\mingw64\bin' >> $env:GITHUB_PATH
      - run: python scripts/build_windows.py ${{ matrix.arguments }}
      - run: choco install ffmpeg --no-progress -y
      - run: python scripts/smoke_windows.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: python3 scripts/build_ios.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-ios-altstore
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [android, windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-downloads
      - name: Prepare release files
        run: python3 scripts/prepare_release.py release-downloads release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace its assets." >&2
            exit 1
          fi
          gh release create "$tag" release-assets/*.apk release-assets/*.ipa release-assets/*.zip release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "$tag (development snapshot)" \
            --notes-file release-assets/RELEASE_NOTES.md \
            --prerelease
